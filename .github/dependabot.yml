# Dependabot 設定
#
# GitHub Actions と npm の更新を有効化しています。
# GitHub Actions の更新はまとめて 1 つの PR にし、PR タイトルは Conventional Commits 形式（chore(deps): ...）になります。
# Dependabot ではなく Renovate を使う場合は本ファイルを削除し、`renovate.json` を追加してください。

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      dev-dependencies:
        dependency-type: "development"
    ignore:
      # typescript-eslint が対応するまで typescript のメジャーバージョン更新は保留する
      # (typescript-eslint@8.64.0 時点では typescript の peer 範囲が >=4.8.4 <6.1.0 で
      #  typescript 7.x 系と競合し、npm ci が ERESOLVE で失敗するため)
      # typescript-eslint を使わない場合や、対応後は削除してください
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # react-native-reanimated はマイナーごとに対応する react-native の範囲が変わる
      # (4.7.x は react-native 0.86 以上が必要で、Expo SDK 56 の 0.85.3 と競合し npm ci が ERESOLVE で失敗した)
      # Expo SDK を上げるときに合わせて手動で更新してください
      - dependency-name: "react-native-reanimated"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # babel-preset-expo / react-native-worklets が Babel 8 に未対応のため、メジャー更新は保留する
      # (@babel/core 8 では expo export が "Requires Babel ^7.0.0-0" で失敗した)
      - dependency-name: "@babel/core"
        update-types: ["version-update:semver-major"]

